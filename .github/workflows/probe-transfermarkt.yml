name: Probe Transfermarkt

# Throwaway diagnostic. Fetches three player profiles and one squad page, and
# reports whether Transfermarkt serves this runner and what the markup looks
# like. Changes nothing, commits nothing. Delete once it has answered.
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'How many player profiles to try'
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pandas requests

      # continue-on-error so a blocked probe still prints its own summary
      # instead of just a red cross. The exit code is in the log either way.
      - name: Probe
        continue-on-error: true
        run: python pipeline/probe_transfermarkt.py --n ${{ inputs.n }}
