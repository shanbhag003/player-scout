name: Probe Transfermarkt 2

# What is actually answering us? Dumps full headers and bodies for two control
# URLs and four Transfermarkt URLs. Makes no judgements, commits nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe
        continue-on-error: true
        run: python pipeline/probe_transfermarkt2.py
