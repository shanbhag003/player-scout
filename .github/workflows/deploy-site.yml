name: Deploy site

# Fires on any push to site/**, so editing a filter, a stylesheet or the cricket
# page redeploys on its own. No data job needed: the cricket JSON is fetched from
# a release rather than rebuilt, which takes seconds instead of minutes.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/build_channels.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # The three built json files, as the data job last left them.
      #
      # This must NOT be continue-on-error. If the fetch quietly fails, the build
      # finds no cricket data, ships the sport as "soon", and someone changing a
      # stylesheet silently removes a live feature. Better to refuse to deploy
      # and say why.
      - name: Fetch the built cricket data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data/cricket
          if ! python pipeline/cricket/store.py pull --tree \
              --repo ${{ github.repository }} --tag cricket-site \
              --local site/data/cricket; then
            echo "::error::Could not fetch the cricket-site release."
            echo "::error::If this repository has never run Cricket daily, run it"
            echo "::error::once — it creates that release. Refusing to deploy a"
            echo "::error::site with cricket silently switched off."
            exit 1
          fi
          ls -la site/data/cricket

      # Women's cricket is the other half of the cricket page's Men/Women toggle,
      # live in production, so its data must be present too — required, like men's.
      - name: Fetch the built women's cricket data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data/cricket-women
          if ! python pipeline/cricket/store.py pull --tree \
              --repo ${{ github.repository }} --tag cricket-women-site \
              --local site/data/cricket-women; then
            echo "::error::Could not fetch cricket-women-site. If this repo has"
            echo "::error::never built women's cricket, run Cricket rebuild once."
            echo "::error::Refusing to deploy with the women's toggle switched off."
            exit 1
          fi

      # Kabaddi is live in production now, so like cricket this must NOT fail
      # quietly: a missing fetch would ship the site with kabaddi switched off.
      # store.py is sport-agnostic; it is reused here with the kabaddi tag.
      - name: Fetch the built kabaddi data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data/kabaddi
          if ! python pipeline/cricket/store.py pull --tree \
              --repo ${{ github.repository }} --tag kabaddi-site \
              --local site/data/kabaddi; then
            echo "::error::Could not fetch the kabaddi-site release. If this repo"
            echo "::error::has never run Kabaddi rebuild, run it once — it creates"
            echo "::error::that release. Refusing to deploy with kabaddi switched off."
            exit 1
          fi
          ls -la site/data/kabaddi

      - name: Build both channels
        run: python pipeline/build_channels.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
